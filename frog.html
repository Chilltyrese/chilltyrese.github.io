<!DOCTYPE html>
<html>

<head>
    <title>Flipping Croking Frogs</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: rgb(66, 212, 66);
        }

        h1 {
            font-size: 40px;
        }

        .frogs {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            padding: 20px;
        }

        .frogs img {
            width: 200px;
            height: 150px;
            object-fit: cover;
            border-radius: 10px;
        }
    </style>
</head>

<body>

    <h1>These are C-R-O-K-I-N-G Frogs</h1>

    <div class="frogs">

        <img src="frog.jpg" alt="A frog">
        <img src="frog2.jpg" alt="A frog">
        <img src="frog23.jpg" alt="A frog">
        <img src="frog24.jpg" alt="A frog">
        <img src="frog25.jpg" alt="A frog">
        <img src="frog26.jpg" alt="A frog">
        <img src="frog27.jpg" alt="A frog">
        <img src="frog28.jpg" alt="A frog">

    </div>

</body>

</html>
